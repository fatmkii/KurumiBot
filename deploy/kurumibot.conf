; 由 deploy/install.sh 自动填入安装路径和运行用户。
[program:kurumibot]
directory=__ROOT__
command=__UV__ run --offline --no-sync --env-file __ENV__ python -m kurumibot run
user=__USER__
environment=HOME="__HOME__",UV_CACHE_DIR="__ROOT__/data/uv-cache"
umask=0077
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/var/log/kurumibot.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:kurumibot-admin]
directory=__ROOT__
command=__UV__ run --offline --no-sync --env-file __ENV__ python -m kurumibot.admin
user=__USER__
environment=HOME="__HOME__",UV_CACHE_DIR="__ROOT__/data/uv-cache"
umask=0077
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/var/log/kurumibot-admin.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
