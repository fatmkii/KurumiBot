; 将 /opt/KurumiBot、uv 绝对路径和运行用户改成服务器实际值。
[program:kurumibot]
directory=/opt/KurumiBot
command=/usr/local/bin/uv run --locked --no-dev --env-file /opt/KurumiBot/.env python -m kurumibot run
user=kurumibot
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/var/log/kurumibot.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:kurumibot-admin]
directory=/opt/KurumiBot
command=/usr/local/bin/uv run --locked --no-dev --env-file /opt/KurumiBot/.env python -m kurumibot.admin
user=kurumibot
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/var/log/kurumibot-admin.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
